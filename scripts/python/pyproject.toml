[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fsloader"
version = "0.1.0"
description = "D365 Field Service demo data loader"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Microsoft Solution Engineering" }]
dependencies = [
    "msal>=1.28",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "faker>=25.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "yamllint>=1.35",
]

[project.scripts]
fsloader = "fsloader.orchestrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
